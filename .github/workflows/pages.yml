name: Seite veröffentlichen

# Veröffentlicht wird über den Zweig gh-pages, nicht über die Pages-API.
# Grund: das Workflow-Token darf keine Pages-Site anlegen ("Resource not
# accessible by integration"), ein Zweig namens gh-pages schaltet Pages
# dagegen ohne Zutun in den Einstellungen frei.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nachgeladene Fremdressourcen sind der DSGVO-Angriffspunkt und kosten
      # Ladezeit. Verweise im Text (Links, canonical, og:url) sind erlaubt.
      - name: Prüfen, dass die Seiten keine externen Dienste nachladen
        run: |
          muster='<script[^>]+src="https?://|<iframe|<img[^>]+src="https?://|<link[^>]+rel="(stylesheet|preload)"[^>]+href="https?://|@import[^;]*https?://|url\((["'"'"']?)https?://'
          for datei in index.html referenzen.html; do
            if grep -Eqi "$muster" "$datei"; then
              echo "::error file=$datei::lädt externe Ressourcen nach"
              grep -Eoi "$muster" "$datei" | sort -u
              exit 1
            fi
          done
          echo "keine externen Ressourcen"

      # referenzen.html wird aus index.html gebaut. Läuft der Bau nicht mehr
      # durch oder weicht das Ergebnis ab, ist die Datei von Hand geändert
      # worden – dann laufen Kopf, Navigation und Fußzeile auseinander.
      - name: Prüfen, dass referenzen.html zum Bauskript passt
        run: |
          cp referenzen.html /tmp/vorher.html
          python3 bau_referenzen.py
          if ! diff -q /tmp/vorher.html referenzen.html >/dev/null; then
            echo "::error file=referenzen.html::weicht vom Bauskript ab – bitte 'python3 bau_referenzen.py' laufen lassen und das Ergebnis einchecken"
            diff /tmp/vorher.html referenzen.html | head -40
            exit 1
          fi
          echo "referenzen.html ist aktuell"

      # Das Monogramm ist gerechnete Geometrie. Von Hand im Pfad zu schieben
      # bricht die Parallelitaet der Winkelarme sichtbar – deshalb muss der
      # Pfad in index.html dem entsprechen, was marke/bau_k.py ausgibt.
      - name: Prüfen, dass das Monogramm zum Bauskript passt
        run: |
          svg=$(cd marke && python3 bau_k.py | tail -1)
          if ! grep -qF "$svg" index.html; then
            echo "::error file=index.html::Monogramm weicht von marke/bau_k.py ab"
            exit 1
          fi
          echo "Monogramm ist aktuell"

      - name: Seite einsammeln
        run: |
          mkdir -p _site
          cp index.html      _site/index.html
          cp referenzen.html _site/referenzen.html
          cp robots.txt      _site/robots.txt
          mkdir -p _site/fotos
          cp fotos/*.webp    _site/fotos/
          touch _site/.nojekyll

      - name: Auf gh-pages veröffentlichen
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Seite aus ${GITHUB_SHA::7}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
          echo "veröffentlicht: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
