name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages muss einmalig unter Einstellungen -> Pages auf „GitHub Actions“
      # gestellt werden. Das Anlegen per Workflow-Token ist nicht erlaubt.
      - uses: actions/configure-pages@v5

      - name: Seite einsammeln
        run: |
          mkdir -p _site
          cp index.html  _site/index.html
          cp robots.txt  _site/robots.txt

      # Nachgeladene Fremdressourcen sind der DSGVO-Angriffspunkt und kosten Ladezeit.
      # Verweise im Text (Links, canonical, og:url) sind ausdrücklich erlaubt.
      - name: Prüfen, dass die Seite keine externen Dienste nachlädt
        run: |
          muster='<script[^>]+src="https?://|<iframe|<img[^>]+src="https?://|<link[^>]+rel="(stylesheet|preload)"[^>]+href="https?://|@import[^;]*https?://|url\((["'"'"']?)https?://'
          if grep -Eqi "$muster" _site/index.html; then
            echo "::error file=index.html::lädt externe Ressourcen nach"
            grep -Eoi "$muster" _site/index.html | sort -u
            exit 1
          fi
          echo "keine externen Ressourcen"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
