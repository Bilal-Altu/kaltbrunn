<script>
(() => {
  'use strict';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];

  /* ── Navigation: Hairline + Blur erst nach dem Anriss ───── */
  const nav = $('#nav'), dock = $('#dock');
  let ticking = false;
  const onScroll = () => {
    const y = window.scrollY;
    nav.classList.toggle('is-stuck', y > 12);
    if (dock) dock.classList.toggle('is-on', y > window.innerHeight * .55);
    ticking = false;
  };
  addEventListener('scroll', () => {
    if (!ticking) { ticking = true; requestAnimationFrame(onScroll); }
  }, { passive: true });
  onScroll();

  /* ── Mobiles Menü ───────────────────────────────────────── */
  const burger = $('#burger'), sheet = $('#sheet');
  const setMenu = (open) => {
    document.body.classList.toggle('menu-open', open);
    document.body.style.overflow = open ? 'hidden' : '';
    burger.setAttribute('aria-expanded', String(open));
    burger.setAttribute('aria-label', open ? 'Menü schließen' : 'Menü öffnen');
    open ? sheet.removeAttribute('inert') : sheet.setAttribute('inert', '');
  };
  burger.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
  $$('a', sheet).forEach(a => a.addEventListener('click', () => setMenu(false)));
  addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  addEventListener('resize', () => { if (innerWidth > 860) setMenu(false); });

  /* ── Einblenden beim Scrollen (einmalig, dezent) ─────────── */
  const reveals = $$('[data-reveal]');
  if (reduced || !('IntersectionObserver' in window)) {
    reveals.forEach(el => el.classList.add('in'));
  } else {
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add('in');
        obs.unobserve(e.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: .1 });
    reveals.forEach(el => io.observe(el));
  }

  /* ── Portrait: minimale Parallaxe, nur solange sichtbar ─── */
  const fig = $('.stage-figure');
  if (fig && !reduced && matchMedia('(min-width: 861px)').matches) {
    let raf = false;
    const move = () => {
      const y = Math.min(window.scrollY, 900);
      fig.style.transform = `translate3d(0, ${(y * -0.045).toFixed(2)}px, 0)`;
      raf = false;
    };
    addEventListener('scroll', () => {
      if (!raf) { raf = true; requestAnimationFrame(move); }
    }, { passive: true });
  }

  /* ── Aktiver Navigationspunkt ───────────────────────────── */
  const navLinks = $$('.nav-links a');
  const sections = navLinks.map(a => $(a.getAttribute('href'))).filter(Boolean);
  if (sections.length && 'IntersectionObserver' in window) {
    const spy = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        navLinks.forEach(a => a.setAttribute('aria-current', String(a.getAttribute('href') === '#' + e.target.id)));
      });
    }, { rootMargin: '-45% 0px -50% 0px' });
    sections.forEach(s => spy.observe(s));
  }

  /* ── Fragen: eine offen, weiche Höhe ────────────────────── */
  const EASE = 'cubic-bezier(.16,1,.3,1)';
  $$('.qa').forEach(item => {
    const head = $('summary', item), body = $('.qa-body', item);
    head.addEventListener('click', ev => {
      if (reduced || !body.animate) return;
      ev.preventDefault();
      if (item.open) {
        body.animate([{ height: body.scrollHeight + 'px', opacity: 1 }, { height: 0, opacity: 0 }],
          { duration: 280, easing: EASE }).onfinish = () => { item.open = false; };
      } else {
        $$('.qa[open]').forEach(other => {
          const ob = $('.qa-body', other);
          ob.animate([{ height: ob.scrollHeight + 'px', opacity: 1 }, { height: 0, opacity: 0 }],
            { duration: 240, easing: EASE }).onfinish = () => { other.open = false; };
        });
        item.open = true;
        body.animate([{ height: 0, opacity: 0 }, { height: body.scrollHeight + 'px', opacity: 1 }],
          { duration: 400, easing: EASE });
      }
    });
  });

  /* ── Anfrage: baut die E-Mail lokal, sendet nichts weg ──── */
  const form = $('#anfrage');
  form.addEventListener('submit', ev => {
    ev.preventDefault();
    if (!form.reportValidity()) return;
    const v = id => ($('#' + id).value || '').trim();
    const art = $('#f-art').value;
    const subject = `Gutachtenanfrage${art ? ' – ' + art : ''} von ${v('f-vorname')} ${v('f-nachname')}`;
    const body = [
      `Name: ${v('f-vorname')} ${v('f-nachname')}`,
      `E-Mail: ${v('f-email')}`,
      v('f-telefon') ? `Telefon: ${v('f-telefon')}` : null,
      art ? `Anliegen: ${art}` : null,
      '',
      'Nachricht:',
      v('f-nachricht')
    ].filter(l => l !== null).join('\n');

    location.href = `mailto:info@ing-nuri.de?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    const btn = $('#submit-btn'), hint = $('#form-hint'), label = btn.textContent;
    btn.textContent = 'E-Mail-Programm geöffnet';
    btn.disabled = true;
    hint.textContent = 'Nichts passiert? Schreiben Sie direkt an info@ing-nuri.de oder rufen Sie an.';
    setTimeout(() => { btn.textContent = label; btn.disabled = false; }, 5000);
  });
})();
</script>
</body>
</html>
